[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=The Last Ritual

[/Script/UnrealEd.ProjectPackagingSettings]
; Ghost data assets are found by search, not by reference, so cook the folder explicitly.
+DirectoriesToAlwaysCook=(Path="/Game/Ghosts")
; Loaded by path at runtime (held gadgets, HUD icons, procedural materials), so cook them explicitly.
+DirectoriesToAlwaysCook=(Path="/Game/Gadgets")
+DirectoriesToAlwaysCook=(Path="/Game/UI")
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Art")
; Maps shipped in the packaged build.
+MapsToCook=(FilePath="/Game/Maps/Haveli_Night1")
+MapsToCook=(FilePath="/Game/Maps/TestRoom")
BuildConfiguration=PPBC_Development
UsePakFile=True
